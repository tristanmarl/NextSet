services:
  connect-sets:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      INTERVAL_SEC: ${INTERVAL_SEC:-600}
      LOOKBACK: ${LOOKBACK:-20}
      NTFY_URL: ${NTFY_URL:-}
      FAIL_ALERT_AFTER: ${FAIL_ALERT_AFTER:-3}
      LIFTOSAUR_SYNC: ${LIFTOSAUR_SYNC:-0}
      LIFTOSAUR_SINCE: ${LIFTOSAUR_SINCE:-}
      LIFTOSAUR_MIN_SEC: ${LIFTOSAUR_MIN_SEC:-300}
      LIFTOSAUR_API_KEY: ${LIFTOSAUR_API_KEY:-}
