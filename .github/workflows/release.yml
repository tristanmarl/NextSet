# Builds and checks NextSet on GitHub's Linux runners (store .iq and one .prg per watch, scanned for
# API keys) and, for a version tag, publishes a GitHub release with notes only. No build files are
# published or kept as artifacts (artifacts of a public repository can be downloaded by anyone):
# NextSet is installed from the Connect IQ Store, and the store .iq is built locally with the key.
# The unit tests are not run here: they need the simulator GUI, so run scripts/test.sh on the Mac
# before tagging.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.5); leave empty to only build and check"
        required: false

permissions:
  contents: write  # reading the draft "ci-devices" release and creating the release both need it

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ciq
        with:
          dev-key: ${{ secrets.NEXTSET_DEV_KEY }}
          token: ${{ github.token }}
      - name: Version and tag check
        id: ver
        run: |
          version="$(grep -E '^[[:space:]]+version="' manifest.xml | head -1 | sed -E 's/.*version="([^"]+)".*/\1/')"
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; fi
          if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          monkeyc -e -r -f monkey.jungle -o "dist/NextSet-$v.iq" -y "$CIQ_KEY"
          # One .prg per watch: every product must build.
          mkdir -p "$RUNNER_TEMP/prg"
          for d in $(grep -o '<iq:product id="[^"]*"' manifest.xml | sed -E 's/.*id="([^"]*)"/\1/'); do
            monkeyc -r -f monkey.jungle -d "$d" -o "$RUNNER_TEMP/prg/NextSet-$v-$d.prg" -y "$CIQ_KEY"
          done
          ls -l dist
      - name: Scan for API keys
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          cp "$RUNNER_TEMP"/prg/*.prg "$RUNNER_TEMP/scan/"
          # .iq packages are 7z archives, not zip.
          for f in dist/*.iq; do 7z x -y -bd -o"$RUNNER_TEMP/scan/$(basename "$f")" "$f" > /dev/null; done
          if grep -rqa 'lftsk_' "$RUNNER_TEMP/scan"; then
            echo "An artifact contains an API key prefix"; exit 1
          fi
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.der"

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Notes: docs/release-notes/X.Y.Z.md when it exists, else the annotated tag's message
          # (checkout does not fetch tag objects, so fetch the tag itself first).
          if [ -f "docs/release-notes/${TAG#v}.md" ]; then
            notes="$(cat "docs/release-notes/${TAG#v}.md")"
          else
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            notes="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          fi
          [ -n "$notes" ] || notes="NextSet ${TAG#v}. Install it from the Connect IQ Store."
          gh release create "$TAG" --latest --title "NextSet ${TAG#v}" --notes "$notes" --target "$GITHUB_SHA"
